# DSH cost tracker bundle patch.
#
# Keep the loader entry id as `dsh-cost-tracker`. It is intentionally stable so
# an older installation and this fork cannot register two copies of the host
# routes, tools, and UI slots at the same time.
#
# The package name below is the installable Project Studios identity. The active
# browser bundle registers the same fully scoped package id in `client.js`.
- insert:
    - id: dsh-cost-tracker
      name: "@shaunpalmer/dsh-cost-tracker"
